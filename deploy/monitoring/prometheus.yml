global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'marketsphere-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'marketsphere-python-service'
    metrics_path: '/health'
    static_configs:
      - targets: ['python-service:8000']
