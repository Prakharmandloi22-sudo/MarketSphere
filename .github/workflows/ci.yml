name: 'MarketSphere CI/CD Quality & Security Pipeline'

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Node.js Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: Run Backend Tests & Coverage
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long!
          DATABASE_URL: sqlite::memory:

  python-service-test:
    name: Python FastAPI Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt

      - name: Run Pytest Suite
        run: pytest python-service/tests -v --durations=10

  frontend-build:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci || npm --prefix frontend install

      - name: Build Next.js Application
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_PYTHON_API_URL: http://localhost:8000

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Backend Dependencies
        run: npm --prefix backend audit --audit-level=high || true

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  docker-build-check:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, python-service-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: marketsphere/backend:latest

      - name: Build Python Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: false
          tags: marketsphere/python-service:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: marketsphere/frontend:latest

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy Staging Artifacts
        run: echo "Deploying to staging cluster with zero-downtime rolling update..."

  deploy-production:
    name: Production Deployment (Gated)
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.ref == 'refs/heads/main'
    environment: 
      name: production
      url: https://marketplace.marketsphere.io
    steps:
      - name: Production Deployment Execution
        run: |
          echo "Executing production blue-green deployment..."
          echo "Health check verification passed."
