version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: marketsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-marketsphere_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketsphere_secret_pass}
      POSTGRES_DB: ${DB_NAME:-marketsphere_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketsphere-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketsphere_user} -d ${DB_NAME:-marketsphere_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Queue
  redis:
    image: redis:7-alpine
    container_name: marketsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - marketsphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Python Pricing, Feed & Recommendation Microservice
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: marketsphere-python-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - marketsphere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Node.js Commerce & Inventory REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-marketsphere_user}:${DB_PASSWORD:-marketsphere_secret_pass}@postgres:5432/${DB_NAME:-marketsphere_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_SERVICE_URL=http://python-service:8000
      - JWT_SECRET=production-secret-jwt-key-marketsphere-at-least-32-chars!
    networks:
      - marketsphere-network

  # 5. Next.js Storefront & Seller UI Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000/api/v1
      - NEXT_PUBLIC_PYTHON_API_URL=http://python-service:8000
    networks:
      - marketsphere-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  marketsphere-network:
    driver: bridge
